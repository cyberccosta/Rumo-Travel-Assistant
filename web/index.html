<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo - assistente de viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--sf:#fff;--ink:#10323A;--mut:#55706F;--line:#D3DEDB;--sea:#1F7A8C;--sun:#F4A62A;--sunink:#3A2500;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D21;--sf:#152A2F;--ink:#E6F0EE;--mut:#93AEAB;--line:#264047;--sea:#5CC1D3;--sun:#F4B54A;--sunink:#2A1B00}}
:root[data-theme="dark"]{--bg:#0E1D21;--sf:#152A2F;--ink:#E6F0EE;--mut:#93AEAB;--line:#264047;--sea:#5CC1D3;--sun:#F4B54A;--sunink:#2A1B00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;max-width:1040px;margin:0 auto;padding:24px 20px 48px}
@media(max-width:820px){.app{grid-template-columns:1fr;gap:20px}}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:20px;align-self:start;position:sticky;top:16px}
@media(max-width:820px){.panel{position:static}}
.brand{font-size:28px;font-weight:800;color:var(--sea)}
.sub{color:var(--mut);margin:4px 0 18px;font-size:14px}
label.f{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=number],select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:9px 4px;font-size:14px;cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--sea);color:var(--bg);font-weight:700}
.seg input:focus-visible+label{outline:2px solid var(--sun);outline-offset:-3px}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:20px;padding:12px;border:0;border-radius:12px;background:var(--sun);color:var(--sunink);font-weight:700}
.go[disabled]{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.note{background:var(--sf);border:1px dashed var(--sea);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--mut);margin-bottom:18px}
.head h2{font-size:34px;font-weight:800}
.head p{margin:6px 0 0;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:22px 0 20px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--mut);font-weight:500;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--sun);font-weight:700}
.trail{position:relative;margin:0;padding:0 0 0 30px;list-style:none}
.trail::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--sea);opacity:.35}
.city{position:relative;margin-bottom:26px}
.city::before{content:"";position:absolute;left:-30px;top:3px;width:21px;height:21px;border-radius:50%;background:var(--sun);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--sea)}
.city h3{font-size:22px}.city .d{color:var(--mut);font-size:14px;margin:2px 0 8px}
.day{border-top:1px solid var(--line);padding:10px 0}
.day b{color:var(--sea)}.day ul{margin:6px 0 0;padding-left:18px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sea)}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:36px;font-weight:800}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ck input{margin-top:5px;accent-color:var(--sea)}
.ck input:checked+span{text-decoration:line-through;color:var(--mut)}
.warn{margin-top:14px;padding:12px 14px;border-left:4px solid var(--sun);background:var(--sf);border-radius:0 10px 10px 0;font-size:14px}
</style>
</head>
<body>
<main class="app">
  <form class="panel" id="f">
    <div class="brand">Rumo</div>
    <p class="sub">Roteiro, custos e entrada no país em um só lugar.</p>
    <label class="f" for="destino">Para onde você vai?</label>
    <input type="text" id="destino" name="destino" value="Tailândia" list="paises" required><datalist id="paises"></datalist>
    <label class="f" for="dias">Quantos dias?</label>
    <input type="number" id="dias" name="dias" min="1" max="60" value="10" required>
    <label class="f" id="le">Estilo de viagem</label>
    <div class="seg" role="radiogroup" aria-labelledby="le">
      <input type="radio" name="estilo" id="e1" value="economico"><label for="e1">Econômico</label>
      <input type="radio" name="estilo" id="e2" value="moderado" checked><label for="e2">Moderado</label>
      <input type="radio" name="estilo" id="e3" value="luxuoso"><label for="e3">Luxuoso</label>
    </div>
    <label class="f" for="passaporte">Seu passaporte</label>
    <select id="passaporte" name="passaporte"></select>
    <button class="go" id="go" type="submit">Montar roteiro</button>
  </form>

  <section id="out" aria-live="polite"></section>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>n==null?"indisponível":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const ESTILO={economico:"Econômico",moderado:"Moderado",luxuoso:"Luxuoso"};
const TABS=[["roteiro","Roteiro"],["transporte","Transporte"],["custos","Custos"],["visto","Visto"],["checklist","Checklist"]];
const CAT={hospedagem:"Hospedagem",alimentacao:"Alimentação",transporte_local:"Transporte local",atividades:"Atividades"};
let plan=null,tab="roteiro",demo=false;
const PAISES=[["DE", "Alemanha"], ["AR", "Argentina"], ["AU", "Austrália"], ["BO", "Bolívia"], ["BR", "Brasil"], ["BE", "Bélgica"], ["KH", "Camboja"], ["CA", "Canadá"], ["CL", "Chile"], ["CN", "China"], ["CO", "Colômbia"], ["KR", "Coreia do Sul"], ["CR", "Costa Rica"], ["HR", "Croácia"], ["EG", "Egito"], ["AE", "Emirados Árabes Unidos"], ["EC", "Equador"], ["ES", "Espanha"], ["US", "Estados Unidos"], ["PH", "Filipinas"], ["FR", "França"], ["GR", "Grécia"], ["HU", "Hungria"], ["ID", "Indonésia"], ["IE", "Irlanda"], ["IS", "Islândia"], ["IT", "Itália"], ["JP", "Japão"], ["MY", "Malásia"], ["MA", "Marrocos"], ["MX", "México"], ["NP", "Nepal"], ["NO", "Noruega"], ["NZ", "Nova Zelândia"], ["PY", "Paraguai"], ["NL", "Países Baixos"], ["PE", "Peru"], ["PL", "Polônia"], ["PT", "Portugal"], ["KE", "Quênia"], ["GB", "Reino Unido"], ["SG", "Singapura"], ["CH", "Suíça"], ["TH", "Tailândia"], ["CZ", "Tchéquia"], ["TR", "Turquia"], ["UY", "Uruguai"], ["VN", "Vietnã"], ["ZA", "África do Sul"], ["AT", "Áustria"], ["IN", "Índia"]];
$("#paises").innerHTML=PAISES.map(p=>`<option value="${p[1]}">`).join("");
$("#passaporte").innerHTML=PAISES.map(p=>`<option value="${p[0]}"${p[0]=="BR"?" selected":""}>${p[1]}</option>`).join("");

function demoPlan(r){
  const cs=[["Bangkok",.4,["Grand Palace e Wat Pho","Mercado flutuante","Street food em Yaowarat"]],["Chiang Mai",.3,["Templos da cidade antiga","Santuário de elefantes","Mercado noturno"]],["Phuket",.3,["Praias do sul","Passeio de barco","Cidade velha"]]];
  let used=0;const cidades=[],roteiro=[];
  cs.forEach(([n,f,it],i)=>{
    const d=Math.max(0,Math.min(r.dias-used,i==2?r.dias-used:(Math.round(r.dias*f)||1)));used+=d;
    if(!d)return;cidades.push({nome:n,dias:d,destaques:it});
    for(let k=0;k<d;k++)roteiro.push({dia:roteiro.length+1,cidade:n,titulo:it[k%3],itens:["Manhã livre para explorar","Almoço local","Retorno ao hotel"]});
  });
  const usd={economico:45,moderado:110,luxuoso:280}[r.estilo]*0.7,rate=5.4,diaria=usd*rate,total=diaria*r.dias;
  return{request:r,demo:true,clima:null,
    itinerario:{cidades,roteiro,
      trechos:cidades.slice(1).map((c,i)=>({de:cidades[i].nome,para:c.nome,modo:"Voo doméstico ou ônibus noturno",duracao:"exemplo",custo_brl:null})),
      checklist:["Passaporte com validade mínima exigida","Seguro viagem","Vacinas recomendadas","Adaptador de tomada","Chip local ou eSIM","Cópia digital dos documentos","Cartão sem IOF e dinheiro em espécie"]},
    custos:{moeda_destino:"THB",cambio:6.4,diaria_brl:diaria,total_brl:total,por_categoria:{hospedagem:total*.4,alimentacao:total*.25,transporte_local:total*.15,atividades:total*.2}},
    visto:{requisito:"Exemplo: o módulo real mostra a regra para o seu passaporte.",estadia_max_dias:null,fonte:"data/visto.csv ou API de visto",consultado_em:new Date().toISOString().slice(0,10),aviso:"Regras mudam. Confirme na embaixada ou no site oficial antes de comprar passagens."}};
}

const V={
  roteiro(p){const it=p.itinerario;
    return `<ol class="trail">${it.cidades.map(c=>`<li class="city"><h3>${esc(c.nome)}</h3><div class="d">${c.dias} ${c.dias>1?"dias":"dia"}: ${c.destaques.map(esc).join(", ")}</div>
    ${it.roteiro.filter(d=>d.cidade===c.nome).map(d=>`<div class="day"><b>Dia ${d.dia}</b> ${esc(d.titulo)}<ul>${d.itens.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</li>`).join("")}</ol>`},
  transporte(p){const t=p.itinerario.trechos;
    return t.length?t.map(x=>`<div class="row"><div><b>${esc(x.de)} para ${esc(x.para)}</b><small>${esc(x.modo)}${x.duracao?", "+esc(x.duracao):""}</small></div><div>${x.custo_brl!=null?brl(x.custo_brl):"sem preço"}</div></div>`).join(""):"<p>Roteiro sem deslocamento entre cidades.</p>"},
  custos(p){const c=p.custos;if(!c)return"<p>Câmbio indisponível agora. Tente de novo em instantes.</p>";
    const mx=Math.max(...Object.values(c.por_categoria));
    return `<div class="big">${brl(c.total_brl)}</div><p style="color:var(--mut);margin:0 0 14px">Estimativa por pessoa, cerca de ${brl(c.diaria_brl)} por dia. Câmbio: 1 BRL = ${c.cambio??"?"} ${esc(c.moeda_destino)}.</p>
    ${Object.entries(c.por_categoria).map(([k,v])=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${CAT[k]||esc(k)}</span><b>${brl(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join("")}`},
  visto(p){const v=p.visto;
    return `<h3 style="font-size:22px">${esc(v.requisito)}</h3><p>Estadia máxima: <b>${v.estadia_max_dias?v.estadia_max_dias+" dias":"não informada"}</b></p><p style="color:var(--mut)">Fonte: ${esc(v.fonte)}. Consultado em ${esc(v.consultado_em)}.</p><div class="warn">${esc(v.aviso)}</div>`},
  checklist(p){return p.itinerario.checklist.map((x,i)=>`<label class="ck"><input type="checkbox" id="c${i}"><span>${esc(x)}</span></label>`).join("")}
};

function show(){
  const r=plan.request,days=plan.itinerario.roteiro.length;
  $("#out").innerHTML=`${demo?`<div class="note">Modo demonstração: sem conexão com o servidor, esta tela mostra sempre a Tailândia, com textos de exemplo. Para planejar outros destinos, abra http://localhost:8000 com o backend rodando.</div>`:""}
  <div class="head"><h2>${esc(demo?"Tailândia":r.destino)}</h2><p>${r.dias} dias, estilo ${ESTILO[r.estilo].toLowerCase()}${plan.custos?", cerca de "+brl(plan.custos.total_brl):""}</p></div>
  <div class="tabs" role="tablist">${TABS.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${n}</button>`).join("")}</div>
  <div>${V[tab](plan)}</div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;show()});
}

let live=false;
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();const fd=new FormData(e.target),btn=$("#go");
  const req={destino:fd.get("destino").trim(),dias:+fd.get("dias"),estilo:fd.get("estilo"),passaporte:fd.get("passaporte"),origem:"Brasil"};
  btn.disabled=true;btn.textContent="Montando...";
  const fim=()=>{btn.disabled=false;btn.textContent="Montar roteiro"};
  if(!live){plan=demoPlan(req);demo=true;tab="roteiro";fim();show();return}
  try{
    const r=await fetch("/api/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(req),signal:AbortSignal.timeout(120000)});
    if(!r.ok){let m="Erro "+r.status;try{m=(await r.json()).detail||m}catch{}throw new Error(m)}
    plan=await r.json();demo=false;tab="roteiro";fim();show();
  }catch(err){fim();$("#out").innerHTML=`<div class="warn"><b>Não foi possível montar o roteiro.</b><br>${esc(err.message||"Falha de conexão com o servidor.")}</div>`}
});
(async()=>{
  try{const r=await fetch("/api/paises",{signal:AbortSignal.timeout(4000)});live=r.ok&&(r.headers.get("content-type")||"").includes("json")}catch{live=false}
  if(live){$("#out").innerHTML=`<div class="note">Servidor conectado. Escolha o destino e clique em Montar roteiro.</div>`}
  else{plan=demoPlan({destino:"Tailândia",dias:10,estilo:"moderado",passaporte:"BR",origem:"Brasil"});demo=true;show()}
})();
</script>
</body>
</html>
